worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 20M;  # Allow PDF and image uploads

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream definitions ──────────────────────────────────────
    upstream server_backend {
        server server:5000;
        keepalive 32;
    }

    upstream client_frontend {
        server client:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── Security Headers ──────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Razorpay Webhook — IP Whitelist ───────────────────────
        # REF: docs/SYSTEM_DESIGN.md §9 — Razorpay Integration
        # Allow only Razorpay IP ranges for webhook endpoint
        location = /api/v1/payments/webhook {
            # Razorpay IP ranges (update periodically from Razorpay docs)
            allow 34.93.228.0/24;
            allow 34.93.40.0/24;
            allow 35.200.12.0/24;
            deny  all;

            proxy_pass         http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # CRITICAL: Pass raw body for HMAC signature verification
            # Do NOT buffer/modify the webhook body
            proxy_request_buffering off;
        }

        # ── API Routes → Express backend ─────────────────────────
        location /api/ {
            proxy_pass         http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # ── Socket.IO → Express backend ──────────────────────────
        location /socket.io/ {
            proxy_pass         http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Socket.IO requires longer timeouts
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ── Static files → React frontend ────────────────────────
        location / {
            proxy_pass         http://client_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
