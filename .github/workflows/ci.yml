name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://localhost:27017/tenantflow_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_long
      RAZORPAY_KEY_ID: rzp_test_mock_key_id
      RAZORPAY_KEY_SECRET: mock_key_secret
      RAZORPAY_WEBHOOK_SECRET: mock_webhook_secret
      CLOUDINARY_CLOUD_NAME: mock_cloud
      CLOUDINARY_API_KEY: mock_api_key
      CLOUDINARY_API_SECRET: mock_api_secret
      AI_PROVIDER: openai
      OPENAI_API_KEY: sk-mock-key-for-tests
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: test@tenantflow.app
      SUPER_ADMIN_EMAIL: superadmin@test.com
      SUPER_ADMIN_PASSWORD: SuperAdmin123!
      BULL_BOARD_USERNAME: admin
      BULL_BOARD_PASSWORD: admin123
      TAX_RATE: 18
      DEFAULT_TRIAL_DAYS: 14
      LOG_LEVEL: error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: apps/server

      - name: Run all tests
        run: npm test -- --forceExit --detectOpenHandles
        working-directory: apps/server

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/server/coverage/
          retention-days: 7
