name: Deploy

on:
  push:
    branches: [main]

# Only run one deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Job 1: Gate on CI passing ─────────────────────────────────────────────
  ci-check:
    name: Wait for CI
    uses: ./.github/workflows/ci.yml

  # ── Job 2: Build & push Docker images ────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server image
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Extract metadata for client image
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/client
          file: ./apps/client/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to server ────────────────────────────────────────────────
  # ⚙ SETUP REQUIRED — add these GitHub Secrets before this job will work:
  #   DEPLOY_HOST      → your server IP or hostname (e.g. 1.2.3.4)
  #   DEPLOY_USER      → SSH username (e.g. ubuntu)
  #   DEPLOY_SSH_KEY   → contents of your private SSH key (~/.ssh/id_rsa)
  #   DEPLOY_PATH      → absolute path on server (e.g. /opt/tenantflow)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull server client

            # Rolling restart (zero-downtime for stateless services)
            docker compose -f docker-compose.prod.yml up -d --no-deps server client

            # Prune old images
            docker image prune -f

            echo "✅ Deployment complete — $(date)"
