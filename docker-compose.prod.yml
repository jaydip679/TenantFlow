version: '3.9'

# TenantFlow — Production Docker Compose
# REF: docs/SYSTEM_DESIGN.md §13 — Docker Architecture

services:
  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image:          nginx:1.25-alpine
    container_name: tenantflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # SSL certificates (mount separately)
    depends_on:
      - server
      - client
    restart: always

  # ── Express.js Backend ─────────────────────────────────────────
  server:
    build:
      context:    ./apps/server
      dockerfile: Dockerfile.prod
    container_name: tenantflow-server
    expose:
      - "5000"
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 20s
    restart: always

  # ── React.js Frontend (served by Nginx) ───────────────────────
  client:
    build:
      context:    ./apps/client
      dockerfile: Dockerfile.prod
    container_name: tenantflow-client
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: always

  # ── MongoDB 7.0 ────────────────────────────────────────────────
  mongodb:
    image:          mongo:7.0
    container_name: tenantflow-mongodb
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=tenantflow
    healthcheck:
      test:         ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s
    restart: always

  # ── Redis 7.2 ──────────────────────────────────────────────────
  redis:
    image:          redis:7.2-alpine
    container_name: tenantflow-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test:         ["CMD", "redis-cli", "ping"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 5s
    restart: always

volumes:
  mongo_data:
    name: tenantflow_mongo_data_prod
  redis_data:
    name: tenantflow_redis_data_prod
